<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Tasks</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(#e9edf5, #d7deea);
    font-family: sans-serif;
  }

  .card {
    background: #ffffff;
    width: 420px;
    max-width: 90vw;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    padding: 32px 32px 28px 32px;
  }

  h1 {
    font-size: 30px;
    font-weight: 800;
    margin: 0 0 24px 0;
    color: #1a2a6c;
    text-align: center;
  }

  .input-row {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }

  #taskInput {
    flex: 1;
    min-width: 0;
    font-size: 15px;
    padding: 10px 14px;
    border: 1px solid #b9c0cc;
    border-radius: 8px;
    outline: none;
  }

  #taskInput:focus {
    border-color: #2f5fdd;
  }

  #addBtn {
    background: #1a2a6c;
    color: #fff;
    border: none;
    padding: 0 22px;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.1s ease;
  }

  #addBtn:hover {
    background: #142058;
  }

  #addBtn:active {
    transform: scale(0.97);
  }

  .tasks-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 20px;
  }

  .task-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #dbe3f0;
    border-radius: 10px;
    padding: 14px 18px;
  }

  .task-item:nth-child(odd) {
    background: #e9eef7;
  }

  .task-text {
    font-size: 16px;
    color: #1a2a6c;
  }

  .delete-btn {
    background: none;
    border: none;
    color: #d62828;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    padding: 4px;
    line-height: 1;
  }

  .counter {
    text-align: center;
    font-size: 15px;
    color: #1a2a6c;
  }
</style>
</head>
<body>

  <div class="card">
    <h1>My Tasks</h1>
    <div class="input-row">
      <input type="text" id="taskInput" placeholder="New task...">
      <button id="addBtn">Add</button>
    </div>
    <div class="tasks-list" id="tasksList"></div>
    <div class="counter" id="counter" style="font-weight: bolder;"></div>
  </div>

  <script>
    let tasks = [];

    const taskInput = document.getElementById('taskInput');
    const addBtn = document.getElementById('addBtn');
    const tasksList = document.getElementById('tasksList');
    const counter = document.getElementById('counter');

    function render() {
      tasksList.innerHTML = '';

      tasks.forEach((task, index) => {
        const item = document.createElement('div');
        item.className = 'task-item';

        const text = document.createElement('span');
        text.className = 'task-text';
        text.textContent = task;

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'delete-btn';
        deleteBtn.textContent = '✕';
        deleteBtn.addEventListener('click', () => {
          tasks.splice(index, 1);
          render();
        });

        item.appendChild(text);
        item.appendChild(deleteBtn);
        tasksList.appendChild(item);
      });

      counter.textContent = `0 of ${tasks.length} task${tasks.length === 1 ? '' : 's'}`;
    }

    function addTask() {
      const value = taskInput.value.trim();
      if (value === '') return;

      tasks.push(value);
      taskInput.value = '';
      render();
    }

    addBtn.addEventListener('click', addTask);
    taskInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') addTask();
    });

    render();
  </script>

</body>
</html>
