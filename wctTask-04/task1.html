<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Profile Card</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #eef1f6;
    font-family: sans-serif;
  }

  .card {
    background: #ffffff;
    width: 420px;
    max-width: 90vw;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    padding: 40px 32px;
    text-align: center;
  }

  .avatar {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    background: #e2e5ea;
    margin: 0 auto 24px auto;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .name {
    font-size: 28px;
    font-weight: 700;
    color: #1a2a5e;
    margin: 0 0 12px 0;
  }

  .major {
    font-size: 17px;
    color: #333;
    margin: 0 0 24px 0;
  }

  .toggle-btn {
    background: #1a2a6c;
    color: #fff;
    border: none;
    padding: 10px 28px;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.1s ease;
  }

  .toggle-btn:hover {
    background: #142058;
  }

  .toggle-btn:active {
    transform: scale(0.97);
  }

  .bio {
    margin-top: 20px;
    font-size: 15px;
    color: #333;
    line-height: 1.5;
    max-height: 0;
    opacity: 0;
    overflow: hidden;
    transition: max-height 0.35s ease, opacity 0.35s ease, margin-top 0.35s ease;
  }

  .bio.show {
    max-height: 200px;
    opacity: 1;
  }
</style>
</head>
<body>

  <div class="card">
    <div class="avatar">

    </div>
    <h2 class="name">Sok Dara</h2>
    <p class="major" style="font-weight: bold;">Information Technology Engineering</p>
    <button class="toggle-btn" id="toggleBtn">Show more</button>
    <p class="bio" id="bio" style="font-weight: bold;">
      I am a year 3 student at RUPP. I love web development and coffee.
    </p>
  </div>

  <script>
    const toggleBtn = document.getElementById('toggleBtn');
    const bio = document.getElementById('bio');

    toggleBtn.addEventListener('click', () => {
      const isShown = bio.classList.toggle('show');
      toggleBtn.textContent = isShown ? 'Show less' : 'Show more';
    });
  </script>

</body>
</html>
