<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ITE Shop</title>
  <!-- Bootstrap 5 CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <!-- Top Navigation Bar -->
  <nav class="navbar navbar-dark bg-dark px-4 py-3 shadow-sm">
    <div class="container-fluid max-w-1000">
      <span class="navbar-brand mb-0 h1 fw-semibold">ITE Shop</span>
      <div class="d-flex align-items-center text-white gap-2">
        <span>Cart</span>
        <span class="badge bg-warning text-dark fs-6 rounded-pill" id="cart-badge">0</span>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="container my-5">
    <div class="row g-4 justify-content-center">
      
      <!-- Products Grid -->
      <div class="col-lg-8">
        <div class="row row-cols-1 row-cols-sm-2 g-3" id="product-list"></div>
      </div>

      <!-- Cart Side Panel -->
      <div class="col-lg-4">
        <div class="card shadow-sm border">
          <div class="card-header bg-primary text-white fw-semibold py-3">
            Your Cart
          </div>
          <ul class="list-group list-group-flush" id="cart-list"></ul>
          <div class="card-footer bg-body-tertiary d-flex justify-content-between align-items-center fw-bold py-3">
            <span>Total:</span>
            <span id="cart-total">$0.00</span>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    const products = [
      { id: 'keyboard', name: 'Keyboard', price: 25.50 },
      { id: 'mouse',    name: 'Mouse',    price: 12.00 },
      { id: 'monitor',  name: 'Monitor',  price: 149.99 },
      { id: 'usbhub',   name: 'USB Hub',  price: 18.75 },
    ];

    const cart = {};

    const productListEl = document.getElementById('product-list');
    const cartListEl = document.getElementById('cart-list');
    const cartTotalEl = document.getElementById('cart-total');
    const cartBadgeEl = document.getElementById('cart-badge');

    function formatMoney(n) {
      return '$' + n.toFixed(2);
    }

    function renderProducts() {
      productListEl.innerHTML = '';
      products.forEach(p => {
        const col = document.createElement('div');
        col.className = 'col';
        col.innerHTML = `
          <div class="card h-100 border shadow-sm">
            <div class="card-body d-flex flex-column justify-content-between p-4">
              <div>
                <h5 class="card-title fw-bold fs-6 mb-1">${p.name}</h5>
                <p class="card-text text-muted mb-3 fs-6">${formatMoney(p.price)}</p>
              </div>
              <div>
                <button class="btn btn-primary btn-sm fw-semibold px-3" data-id="${p.id}">Add to cart</button>
              </div>
            </div>
          </div>
        `;
        col.querySelector('button').addEventListener('click', () => addToCart(p.id));
        productListEl.appendChild(col);
      });
    }

    function addToCart(id) {
      cart[id] = (cart[id] || 0) + 1;
      renderCart();
    }

    function removeFromCart(id) {
      if (!cart[id]) return;
      cart[id] -= 1;
      if (cart[id] <= 0) delete cart[id];
      renderCart();
    }

    function totalItemCount() {
      return Object.values(cart).reduce((a, b) => a + b, 0);
    }

    function renderCart() {
      const ids = Object.keys(cart);
      cartListEl.innerHTML = '';

      let total = 0;

      if (ids.length === 0) {
        cartListEl.innerHTML = '<li class="list-group-item text-muted p-3">Cart is empty</li>';
      } else {
        ids.forEach(id => {
          const p = products.find(pr => pr.id === id);
          const qty = cart[id];
          const subtotal = p.price * qty;
          total += subtotal;

          const row = document.createElement('li');
          row.className = 'list-group-item d-flex justify-content-between align-items-center p-3 fs-6';
          row.innerHTML = `
            <div>
              <span class="fw-medium">${p.name}</span>
              <span class="text-muted small ms-1">x ${qty}</span>
            </div>
            <div class="d-flex align-items-center gap-3">
              <span class="fw-medium">${formatMoney(subtotal)}</span>
              <button class="btn btn-outline-danger btn-sm p-0 rounded d-flex align-items-center justify-content-center" 
                      style="width: 24px; height: 24px;" 
                      data-id="${id}">&minus;</button>
            </div>
          `;
          row.querySelector('button').addEventListener('click', () => removeFromCart(id));
          cartListEl.appendChild(row);
        });
      }

      cartTotalEl.textContent = formatMoney(total);
      cartBadgeEl.textContent = totalItemCount();
    }

    renderProducts();
    renderCart();
  </script>

  <!-- Bootstrap 5 JS Bundle CDN -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
