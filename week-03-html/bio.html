<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <header>
    <h1>Home</h1>
    <img src="https://i.pinimg.com/736x/af/1b/b4/af1bb4add7db873d7d076495cfa4abe4.jpg" alt="Me" style="width: 100px; height: 100px;">
  
  </header>
  
  <main>
    <h2>Morning Activities: </h2>
    <ol>
      <li>Wake up</li>
      <li>Brush Teeth</li>
      <li>Breakfast</li>
      <li>Code</li>
    </ol>
    <a href="https://www.youtube.com/">Youtube</a>
    <hr>
    <table border="1" style="width: 500px; height: 100px;">
      <thead>
        <th>Brush Teeth</th>
        <th>Breakfast</th>
        <th>Code</th>
      </thead>
      <tbody>
        <tr>
          <td>5 Minutes</td>
          <td>10 Minutes</td>
          <td>900 Minutes</td>
        </tr>
      </tbody>
    </table>
    <section>
      <form action="#" method="get">
      <h2>Form</h2>
      <label for="name">Name: </label>
      <input type="text" id="name" name="name" required>
      <br><br>
      <label for="gmail">Gmail: </label>
      <input type="email" id="gmail" name="gmail">
      <br><br>
      <label for="age">Age: </label>
      <input type="number" id="age" name="age">
      <br><br>
      <label for="password">Password: </label>
      <input type="password" id="password" name="password" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" required title="Must contain at least one number, one uppercase and lowercase letter, and at least 8 characters">
      <br><br>
      <button 
  type="submit" 
  style="background-color: black; color: white;" 
  aria-label="Submit Form" id="submit" value="submit"
>
  Submit
</button>

      <br><br>
    </form>
    </section>
  </main>
  <footer>
    <nav>
      <a href="../week-02-html/site/projects.html">Go to projects</a> <br>
      <a href="../week-02-html/site/contact.html">Go to contact</a>
    </nav>
    <p>Thanks you</p>
  </footer>
  
</body>
</html>
